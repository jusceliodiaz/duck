<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duck Dodgers — Fazemos patos. Só que diferentes.</title>
<meta name="description" content="Seis personagens colecionáveis, cada um com nome, fantasia e temperamento próprios. A loja abre em breve — entre na lista e saiba primeiro.">
<meta name="theme-color" content="#14120D">
<link rel="icon" href="img/logo.webp">

<!-- Preview ao compartilhar o link. A maioria dos leitores de og:image exige
     URL absoluta: troque por https://SEU-DOMINIO/img/... ao publicar. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Fazemos patos. Só que diferentes.">
<meta property="og:description" content="Seis personagens colecionáveis, cada um com nome, fantasia e temperamento próprios. A loja abre em breve.">
<meta property="og:image" content="img/hero-02-md.webp">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/coming.css">
<script defer src="assets/js/coming.js"></script>
</head>

<body>
<!-- Fundo em três camadas. As colunas de fotos são montadas em coming.js
     (são ~60 nós puramente decorativos; não valem o peso no HTML). -->
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header>
  <a href="./" aria-label="Duck Dodgers">
    <img src="img/logo.webp" alt="Duck Dodgers" width="560" height="290">
  </a>
  <span class="status"><i aria-hidden="true"></i> ABRINDO EM BREVE</span>
</header>

<!-- A ordem aqui é fala → elenco, e só o CSS inverte (order: -1). Assim o
     leitor de tela encontra o h1 antes do h2; o elenco não tem nada focável,
     então a ordem de tabulação não se desencontra do que se vê. -->
<main>
  <div class="say">
    <p class="eyebrow"><span aria-hidden="true"></span> COLEÇÃO 01</p>

    <h1>Fazemos patos.<br><em>Só que diferentes.</em></h1>

    <p class="intro">Seis personagens com nome, fantasia e temperamento próprios. Nenhum deles foi feito para a banheira.</p>

    <form id="notifyForm" novalidate>
      <label for="email">Avisamos no dia que a loja abrir.</label>
      <div class="email-field">
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254"
               placeholder="seu@email.com" required aria-describedby="formMessage privacy">
        <button type="submit" id="notifyButton">Quero saber <span aria-hidden="true">↗</span></button>
      </div>
      <!-- isca para robô: fora da tela e fora da ordem de tabulação -->
      <div class="honeypot" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
      <p id="formMessage" role="status"></p>
      <p class="privacy" id="privacy">Um e-mail só, no dia da inauguração. Depois disso, silêncio.</p>
    </form>
  </div>

  <!-- O elenco: cada pato aparece uma única vez e fica onde está. -->
  <section class="cast" aria-label="A turma de estreia">
    <ul>
      <li style="--i:0"><figure><img src="img/xerif-sm.webp" srcset="img/xerif-sm.webp 480w, img/xerif.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Xerife Duck, de chapéu e estrela" width="480" height="480" decoding="async"><figcaption>Xerife</figcaption></figure></li>
      <li style="--i:1"><figure><img src="img/cyber-sm.webp" srcset="img/cyber-sm.webp 480w, img/cyber.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Cyber Duck, de visor e armadura" width="480" height="480" decoding="async"><figcaption>Cyber</figcaption></figure></li>
      <li style="--i:2"><figure><img src="img/ghost-sm.webp" srcset="img/ghost-sm.webp 480w, img/ghost.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Ghost Duck, com lençol e abóbora" width="480" height="480" decoding="async"><figcaption>Ghost</figcaption></figure></li>
      <li style="--i:3"><figure><img src="img/et-sm.webp" srcset="img/et-sm.webp 480w, img/et.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Alien Duck, fantasiado de alienígena" width="480" height="480" decoding="async"><figcaption>Alien</figcaption></figure></li>
      <li style="--i:4"><figure><img src="img/dino-sm.webp" srcset="img/dino-sm.webp 480w, img/dino.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Dino Duck, fantasiado de dinossauro" width="480" height="480" decoding="async"><figcaption>Dino</figcaption></figure></li>
      <li style="--i:5"><figure><img src="img/cow-sm.webp" srcset="img/cow-sm.webp 480w, img/cow.webp 1200w" sizes="(max-width:640px) 31vw, (max-width:900px) 30vw, 16vw" alt="Cow Duck, de pijama de vaca" width="480" height="480" decoding="async"><figcaption>Cow</figcaption></figure></li>
    </ul>
  </section>
</main>

<footer>
  <span>© 2026 Duck Dodgers</span>
</footer>

<noscript><p class="noscript">Ative o JavaScript para cadastrar seu e-mail.</p></noscript>
</body>
</html>
